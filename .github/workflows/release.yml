name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # Don't cancel sibling platforms when one fails — a 5-minute lint failure
      # on linux shouldn't waste the 15 minutes already spent on the mac signer.
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-14
            cache_path: ~/Library/Caches/electron
            artifact_glob: |
              dist/make/**/*.dmg
              dist/make/**/*.zip
          - platform: windows
            os: windows-latest
            cache_path: ~\AppData\Local\electron\Cache
            artifact_glob: |
              dist/make/**/*.exe
              dist/make/**/*.nupkg
              dist/make/**/RELEASES
              dist/make/**/*.zip
          - platform: linux
            os: ubuntu-latest
            cache_path: ~/.cache/electron
            artifact_glob: |
              dist/make/**/*.deb
              dist/make/**/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_path }}
          key: electron-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.platform }}-
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg libarchive-tools
      - run: pnpm install --frozen-lockfile
      # Workaround for upstream electron-winstaller bug: vendored 7z binaries
      # are named with -x64 suffix but the runtime resolver looks for plain
      # 7z.exe / 7z.dll. Tracked at:
      #   https://github.com/electron/windows-installer/issues/527
      # Drop this step once the upstream fix lands and we bump
      # electron-winstaller (transitive of @electron-forge/maker-squirrel).
      - name: Fix electron-winstaller 7z vendor (os.arch bug)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vendorDir = "node_modules\electron-winstaller\vendor"
          Copy-Item "$vendorDir\7z-x64.exe" "$vendorDir\7z.exe" -Force
          Copy-Item "$vendorDir\7z-x64.dll" "$vendorDir\7z.dll" -Force

      # Decode the Developer ID Application cert into an isolated keychain that
      # exists only for this run. The keychain is locked with a per-run random
      # password and torn down on job completion (success or failure) so the
      # private key never persists on the runner image cache.
      #
      # set +x is on by default for `run:` blocks; we additionally avoid echoing
      # any decoded secret. Intermediate files live under $RUNNER_TEMP, which
      # GitHub wipes between jobs.
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Pin the exact identity for forge.config.ts so signing fails closed
          # if the keychain ever holds something unexpected.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found after import"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "BUILD_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          rm -f "$CERT_PATH"

      # Notarytool reads the App Store Connect API key from a file path. Stage
      # the .p8 to a runner-temp path and expose only the path via env.
      - name: Stage Apple API key for notarization
        if: matrix.platform == 'mac'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - run: pnpm make
        env:
          MAIN_VITE_SENTRY_DSN: ${{ secrets.MAIN_VITE_SENTRY_DSN }}
          MAIN_VITE_RELEASE_SERVER_URL: ${{ secrets.MAIN_VITE_RELEASE_SERVER_URL }}
          MAIN_VITE_GITHUB_RELEASES_URL: ${{ secrets.MAIN_VITE_GITHUB_RELEASES_URL }}
          VITE_WEBSITE_URL: ${{ secrets.VITE_WEBSITE_URL }}
          VITE_REPO_URL: ${{ secrets.VITE_REPO_URL }}
          # Only consumed by the Windows Squirrel maker; harmless on mac/linux.
          MAIN_VITE_BREW_CASK_NAME: ${{ secrets.MAIN_VITE_BREW_CASK_NAME }}
          # Notarytool credentials — only set when the import step ran.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Always wipe the keychain and key file, even if `pnpm make` failed. The
      # runner is ephemeral but explicit cleanup means the private key isn't
      # sitting around if a later step uploads $RUNNER_TEMP somewhere.
      - name: Tear down macOS signing keychain
        if: matrix.platform == 'mac' && always()
        run: |
          if [ -n "${BUILD_KEYCHAIN_PATH:-}" ] && [ -f "$BUILD_KEYCHAIN_PATH" ]; then
            security delete-keychain "$BUILD_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          compression-level: 9
          name: ${{ matrix.platform }}-artifacts
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( \
            -name "*.dmg" -o -name "*.zip" \
            -o -name "*.exe" -o -name "*.nupkg" \
            -o -name "RELEASES" \
            -o -name "*.deb" -o -name "*.rpm" \
          \) -exec cp {} release-files/ \;

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # strip leading 'v' for semver use inside manifests
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate update manifests
        run: node scripts/generate-update-manifests.mjs --dir release-files --version "${{ steps.version.outputs.version }}"

      - name: Extract changelog for this release
        id: changelog
        run: |
          node scripts/extract-release-notes.mjs > release-notes.md
          # Test for visible content, not for a non-zero file size. The script
          # always appends a trailing newline, so a section with no entries —
          # a release made up entirely of hidden commit types, e.g. only chore
          # — yields a 1-byte file. That passes `-s`, the fallback never fires,
          # and the release publishes with an empty body.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::changelog section for this release is empty; falling back to the full CHANGELOG"
            cp CHANGELOG.md release-notes.md
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Install only the runtime dependency closure so the SBOM reflects what
      # users actually run (the contents of app.asar), not build tooling.
      # Scanning the full dev tree flags unfixable CVEs in vendored binaries
      # — esbuild's Go stdlib and electron-winstaller's bundled 7-Zip 16.04 —
      # neither of which ships to users. Syft can't introspect .asar/.dmg, so
      # a fresh prod install is the cleanest source of signal.
      - name: Install production-only dependency tree for SBOM
        run: |
          mkdir -p sbom-scope
          cp package.json pnpm-lock.yaml sbom-scope/
          cp -R patches sbom-scope/
          cd sbom-scope
          pnpm install --prod --ignore-scripts --frozen-lockfile
          # Remove the manifests *after* install. Syft's pnpm-lock cataloger
          # would otherwise enumerate every entry in the lockfile (including
          # devDeps like @electron-forge and its build-tool transitives),
          # ignoring what's actually on disk. Deleting them forces syft to
          # walk node_modules/ instead, which only contains the prod tree.
          rm -f package.json pnpm-lock.yaml
          rm -rf patches

      - name: Generate SBOM of shipped dependencies
        uses: anchore/sbom-action@v0
        with:
          path: sbom-scope
          format: cyclonedx-json
          output-file: release-files/sbom.cyclonedx.json
          # Enables the npm package cataloger so syft walks the installed
          # node_modules tree instead of falling back to the lock cataloger
          # (which we already removed inputs for).
          config: .syft.yaml

      - name: Scan shipped dependencies for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          sbom: release-files/sbom.cyclonedx.json
          fail-build: true
          severity-cutoff: high

      # Uploads run one at a time and into a *draft*.
      #
      # v1.5.1 failed twice here with a bare "Error saving asset". The action
      # uploads every file with `Promise.all`, so all twelve (~1.1 GB) hit the
      # asset endpoint at once, and it has no retry for a server-side upload
      # failure: one rejection fails the step with seven or eight assets
      # already attached. `preserve_order` serialises the uploads, and the
      # repair step below re-tries whatever still did not land.
      #
      # The draft matters for the same reason. A public release is the update
      # feed: the manifests are small and upload first, so a half-finished
      # release advertises latest-mac.yml while the .zip it points at is still
      # missing, and every running app sees an update it cannot download. The
      # release is published at the end, once every asset is verified.
      - name: Publish GitHub Release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ClaudeWatch ${{ steps.version.outputs.tag }}"
          body_path: release-notes.md
          draft: true
          prerelease: false
          preserve_order: true
          files: |
            release-files/*.dmg
            release-files/*.zip
            release-files/*.exe
            release-files/*.nupkg
            release-files/RELEASES
            release-files/*.deb
            release-files/*.rpm
            release-files/latest.yml
            release-files/latest-linux.yml
            release-files/latest-mac.yml
            release-files/sbom.cyclonedx.json

      # Whatever the action left behind gets another go here, one file at a
      # time. `--clobber` replaces a partial asset rather than failing on the
      # name, and a release that was never created at all is created now, so
      # a failure inside the action above costs a retry instead of the run.
      - name: Upload any assets that did not land
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet — creating the draft."
            gh release create "$TAG" --draft \
              --title "ClaudeWatch $TAG" --notes-file release-notes.md
          fi

          missing_assets() {
            gh release view "$TAG" --json assets \
              --jq '[.assets[] | select(.state == "uploaded") | .name] | join("\n")' > uploaded.txt
            missing=""
            for f in release-files/*; do
              name=$(basename "$f")
              grep -qxF "$name" uploaded.txt || missing="$missing $name"
            done
            echo "$missing"
          }

          for attempt in 1 2 3; do
            missing=$(missing_assets)
            if [ -z "${missing// /}" ]; then
              echo "All assets are attached to $TAG."
              exit 0
            fi
            echo "::warning::attempt ${attempt}: missing assets —${missing}"
            for name in $missing; do
              echo "Uploading ${name}..."
              # A failure here must not end the step: the whole point is to
              # come back around and try the rest, then try this one again.
              if ! gh release upload "$TAG" "release-files/${name}" --clobber; then
                echo "::warning::upload of ${name} failed on attempt ${attempt}"
              fi
            done
            sleep 5
          done

          missing=$(missing_assets)
          if [ -n "${missing// /}" ]; then
            echo "::error::assets still missing after three attempts —${missing}"
            exit 1
          fi

      # Defence in depth against rare GitHub upload corruption: download what
      # we just uploaded and re-verify SHA-256 against the local copy. If
      # anything mismatches we fail loudly so the release can be re-cut, and
      # we don't ship subtly-broken installers.
      #
      # The release is still a draft here, so its assets have no public
      # download URL yet: they are fetched through the API by asset id.
      - name: Verify uploaded artifact integrity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verify-files
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
            --jq '.[] | "\(.id) \(.name)"' > assets.txt
          fail=0
          for f in release-files/*.dmg release-files/*.exe release-files/*.zip \
                   release-files/*.nupkg release-files/*.deb release-files/*.rpm; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            asset_id=$(awk -v n="$name" '$2 == n {print $1}' assets.txt)
            if [ -z "$asset_id" ]; then
              echo "::error::${name} is not attached to ${TAG}"
              fail=1
              continue
            fi
            echo "Verifying ${name}..."
            curl -fL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o "verify-files/${name}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            local_sha=$(shasum -a 256 "$f" | awk '{print $1}')
            remote_sha=$(shasum -a 256 "verify-files/${name}" | awk '{print $1}')
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "::error::Hash mismatch for ${name}: local=${local_sha} remote=${remote_sha}"
              fail=1
            fi
            rm -f "verify-files/${name}"
          done
          rm -rf verify-files
          exit $fail

      # Only now does the release become public — and with it the update feed
      # that every installed app polls.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "Published $(gh release view "$TAG" --json url --jq .url)"

  publish-apt-repo:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-apt-repo.yml
    with:
      ref_name: ${{ github.ref_name }}
    secrets:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}

  publish-homebrew:
    needs: release
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Reclaim Actions artifact storage (free tier: 500 MB) once every consumer
  # has finished. The artifacts only exist to hand build outputs from the
  # matrix runners to release / publish-apt-repo / publish-homebrew — after
  # those jobs complete, they are dead weight that would sit for retention-days.
  cleanup-artifacts:
    needs: [release, publish-apt-repo, publish-homebrew]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: '*'
          useGlob: true
          failOnError: false
